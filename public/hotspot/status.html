<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Status da Conexão - WFV Admin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
    }
    .stats-table {
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
      font-size: 13px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #1e293b;
    }
    .stats-row:last-child {
      border-bottom: none;
    }
    .stats-label {
      color: #94a3b8;
    }
    .stats-val {
      font-weight: 600;
      color: #f1f5f9;
      font-family: monospace;
    }
    .btn-logout {
      width: 100%;
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Conectado à Internet</span>
    </div>

    <h1>WFV Hotspot Ativo</h1>

    <div class="stats-table">
      <div class="stats-row">
        <span class="stats-label">Voucher / Usuário:</span>
        <span class="stats-val">$(username)</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Tempo Conectado:</span>
        <span class="stats-val">$(uptime)</span>
      </div>
      <!-- $(if session-time-left) -->
      <div class="stats-row">
        <span class="stats-label">Tempo Restante:</span>
        <span class="stats-val" style="color: #38bdf8;">$(session-time-left)</span>
      </div>
      <!-- $(endif) -->
      <div class="stats-row">
        <span class="stats-label">Download / Upload:</span>
        <span class="stats-val">$(bytes-out-nice) / $(bytes-in-nice)</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Endereço IP:</span>
        <span class="stats-val">$(ip)</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Endereço MAC:</span>
        <span class="stats-val">$(mac)</span>
      </div>
    </div>

    <form action="$(link-logout)" name="logout">
      <input type="hidden" name="erase-cookie" value="on" />
      <button type="submit" class="btn-logout">
        Desconectar Acesso Wi-Fi
      </button>
    </form>
  </div>
</body>
</html>
